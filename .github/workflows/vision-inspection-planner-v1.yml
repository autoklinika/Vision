name: Vision Inspection Planner V1
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-photography.txt
      - name: Core and Runtime compatibility
        run: PYTHONPATH=src python -m unittest discover -s tests/core -q
      - name: Planner geometry, service boundaries and durable integration
        run: PYTHONPATH=src:tests/core:tests/planner python -m unittest discover -s tests/planner -v
      - run: python -m compileall -q src tests/core tests/planner tools/lab/inspection_planner
      - run: git diff --check
