name: ECU reference profile
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-photography.txt
      - run: python -m unittest discover -s tests/core -v
        env:
          PYTHONPATH: src
      - run: python -m compileall -q src tests/core
