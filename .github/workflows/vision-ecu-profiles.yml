name: Vision ECU profiles
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-photography.txt
      - run: PYTHONPATH=src python3 -m unittest discover -s tests/core -v
      - run: python3 -m compileall -q src/vision_core src/vision_modules tests/core
