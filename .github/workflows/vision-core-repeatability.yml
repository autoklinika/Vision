name: Vision Core repeatability offline
on: [push, pull_request]
jobs:
  repeatability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-photography.txt
      - run: PYTHONPATH=src python -m unittest discover -s tests/core -v
      - run: python -m compileall -q src/vision_core tests/core
