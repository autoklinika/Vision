name: Vision storage guard

on:
  pull_request:
  push:
    branches:
      - feature/nvme-write-guard-v1

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile scripts/storage/vision_run.py tests/test_vision_storage.py
      - name: Storage policy tests
        run: python3 -m unittest discover -s tests -p 'test_vision_storage.py' -v
